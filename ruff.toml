# Ruff configuration
# https://docs.astral.sh/ruff/

line-length = 100
target-version = "py27"  # Support Python 2.7+

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade (but limited for py27 compat)
]

ignore = [
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
    "UP",    # Disable pyupgrade rules (not compatible with Python 2.7)
]

[format]
quote-style = "double"
indent-style = "tab"  # Match existing code style
