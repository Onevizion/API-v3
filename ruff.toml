# Ruff configuration
# https://docs.astral.sh/ruff/
# Note: Ruff only supports Python 3.7+, but can lint code that runs on 2.7

line-length = 100
target-version = "py37"

[lint]
select = [
    "E9",   # Syntax errors only (critical)
    "F63",  # Invalid print statements
    "F7",   # Syntax errors
    "F82",  # Undefined names
]

ignore = []

[format]
quote-style = "double"
indent-style = "tab"  # Match existing code style
