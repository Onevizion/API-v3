# Ruff configuration
# https://docs.astral.sh/ruff/
# Note: Ruff only supports Python 3.7+, but can lint code that runs on 2.7

line-length = 100
target-version = "py37"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
]

ignore = [
    "E501",  # line too long (handled by formatter)
]

[format]
quote-style = "double"
indent-style = "tab"  # Match existing code style
