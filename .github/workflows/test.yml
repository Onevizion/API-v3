name: Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:

# Cancel in-progress runs when a new workflow with the same group name is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Docker containers are automatically cached by GitHub Actions runners
    container: ${{ matrix.container }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 2.7 (container)
          - python-version: "2.7"
            os: ubuntu-latest
            container: python:2.7

          # Python 3.5-3.6 (container)
          - python-version: "3.5"
            os: ubuntu-latest
            container: python:3.5

          - python-version: "3.6"
            os: ubuntu-latest
            container: python:3.6

          # Python 3.7-3.10 (ubuntu-22.04)
          - python-version: "3.7"
            os: ubuntu-22.04

          - python-version: "3.8"
            os: ubuntu-22.04

          - python-version: "3.9"
            os: ubuntu-22.04

          - python-version: "3.10"
            os: ubuntu-22.04

          # Python 3.11-3.13 (latest)
          - python-version: "3.11"
            os: ubuntu-latest
            upload-coverage: true

          - python-version: "3.12"
            os: ubuntu-latest

          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        if: matrix.container == ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        if: matrix.container == ''
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache pip packages (Python < 3.6)
        if: matrix.container != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies with pip (Python < 3.6)
        if: matrix.container != ''
        run: |
          python -m pip install --upgrade 'pip<21.0' 'setuptools<45' wheel
          pip install -r requirements-dev.txt
          pip install .

      - name: Run tests with uv (Python >= 3.6)
        if: matrix.container == ''
        run: |
          uv sync --extra dev --python ${{ matrix.python-version }}
          uv run pytest tests/ -v --cov=onevizion --cov-report=term-missing --cov-report=html --cov-report=xml

      - name: Run tests with pip (Python < 3.6)
        if: matrix.container != ''
        run: |
          pytest tests/ -v --cov=onevizion --cov-report=term-missing --cov-report=html --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.upload-coverage == true && success()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          flags: python-${{ matrix.python-version }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage HTML report
        if: matrix.upload-coverage == true && success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run ruff check onevizion/ tests/

  check-deps:
    name: Validate requirements files consistency
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4
      - name: Check package names match between files
        run: |
          # Extract package names from pyproject.toml dev dependencies
          pyproject_packages=$(grep -A 20 '\[project.optional-dependencies\]' pyproject.toml | \
            grep -E '^\s+"[a-z0-9-]+(>=|<|==)' | \
            sed -E 's/^\s+"([a-z0-9-]+).*/\1/' | \
            sort -u)

          # Extract package names from requirements-dev.txt
          reqdev_packages=$(grep -v '^#' requirements-dev.txt | \
            grep -v '^$' | \
            sed -E 's/^([a-z0-9-]+).*/\1/' | \
            grep -v '^requests$' | \
            sort -u)

          echo "Packages in pyproject.toml dev:"
          echo "$pyproject_packages"
          echo ""
          echo "Packages in requirements-dev.txt:"
          echo "$reqdev_packages"
          echo ""

          # Basic check - all pyproject packages should exist in requirements-dev
          missing=""
          for pkg in $pyproject_packages; do
            if ! echo "$reqdev_packages" | grep -q "^${pkg}$"; then
              missing="${missing}${pkg} "
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing packages in requirements-dev.txt: $missing"
            exit 1
          fi

          echo "Package names are consistent"

  package:
    name: Package builds and installs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist + wheel
        run: uv build

      # Installed OUTSIDE the source tree on purpose. Run from the repo root,
      # `import onevizion` resolves to ./onevizion and passes even when the
      # build produced metadata-less UNKNOWN-0.0.0 artifacts.
      - name: Install the wheel into a clean venv and import it
        run: |
          set -eu
          python -m venv /tmp/smoke-wheel
          /tmp/smoke-wheel/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/smoke-wheel/bin/python - <<'SMOKE'
          import importlib.metadata as md
          import onevizion

          dist = md.distribution("onevizion")
          print("installed", dist.metadata["Name"], dist.version)
          assert dist.metadata["Name"].lower() == "onevizion"
          assert dist.version != "0.0.0", "metadata-less build (UNKNOWN-0.0.0)"
          assert "site-packages" in onevizion.__file__, "imported from the source tree, not the install"
          SMOKE

      # Python 2.7 is a supported target, and the test matrix cannot prove it.
      # That leg installs requirements-dev.txt (which carries enum34) and then
      # imports from the source tree, so a missing RUNTIME dependency is
      # invisible to it. This installs the built wheel into a bare 2.7 with no
      # dev extras -- what a consumer actually gets from `pip install onevizion`.
      - name: Install the wheel on Python 2.7 and import it
        run: |
          set -eu
          cat > /tmp/py27check.py <<'PY'
          import onevizion, pkg_resources
          d = pkg_resources.get_distribution("onevizion")
          print("version", d.version)
          print("loaded", onevizion.__file__)
          assert d.version != "0.0.0", "metadata-less install (UNKNOWN-0.0.0)"
          assert "site-packages" in onevizion.__file__, "imported from the source tree"
          print("py2.7 wheel install + import OK")
          PY
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v /tmp/py27check.py:/tmp/py27check.py:ro \
            -w /tmp python:2.7 \
            sh -c 'pip install --quiet /dist/*-py2.py3-none-any.whl && python /tmp/py27check.py'

      - name: Install the sdist into a clean venv and import it
        run: |
          set -eu
          python -m venv /tmp/smoke-sdist
          /tmp/smoke-sdist/bin/pip install --quiet dist/*.tar.gz
          cd /tmp
          /tmp/smoke-sdist/bin/python - <<'SMOKE'
          import importlib.metadata as md
          import onevizion

          dist = md.distribution("onevizion")
          print("installed", dist.metadata["Name"], dist.version)
          assert dist.version != "0.0.0", "metadata-less sdist build (UNKNOWN-0.0.0)"
          assert "site-packages" in onevizion.__file__
          SMOKE

  # Summary job that all checks must pass
  check:
    name: All Tests Passed
    if: always()
    needs: [test, lint, check-deps, package]
    runs-on: ubuntu-latest

    steps:
      - name: Check test matrix status
        if: needs.test.result != 'success'
        run: exit 1

      - name: Check lint status
        if: needs.lint.result != 'success'
        run: exit 1

      - name: Check deps sync status
        if: needs.check-deps.result != 'success'
        run: exit 1

      - name: Check package build status
        if: needs.package.result != 'success'
        run: exit 1

      - name: All checks passed
        run: echo "All tests, lint checks, packaging, and dependency validation passed"
