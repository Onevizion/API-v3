name: Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

# Cancel in-progress runs when a new workflow with the same group name is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 2.7 (ubuntu-20.04 has it pre-installed)
          - python-version: "2.7"
            os: ubuntu-20.04
            toxenv: py27

          # Python 3.5-3.6 (need ubuntu-20.04)
          - python-version: "3.5"
            os: ubuntu-20.04
            toxenv: py35

          - python-version: "3.6"
            os: ubuntu-20.04
            toxenv: py36

          # Python 3.7-3.10 (need ubuntu-22.04, not available on 24.04)
          - python-version: "3.7"
            os: ubuntu-22.04
            toxenv: py37

          - python-version: "3.8"
            os: ubuntu-22.04
            toxenv: py38

          - python-version: "3.9"
            os: ubuntu-22.04
            toxenv: py39

          - python-version: "3.10"
            os: ubuntu-22.04
            toxenv: py310

          - python-version: "3.11"
            os: ubuntu-latest
            toxenv: py311
            upload-coverage: true  # Only upload from one version

          - python-version: "3.12"
            os: ubuntu-latest
            toxenv: py312

          - python-version: "3.13"
            os: ubuntu-latest
            toxenv: py313

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: |
          uv sync --extra dev --python ${{ matrix.python-version }}
          uv run pytest tests/ -v --cov=onevizion --cov-report=term-missing --cov-report=html --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.upload-coverage == true && success()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          flags: python-${{ matrix.python-version }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage HTML report
        if: matrix.upload-coverage == true && success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ruff linter
        run: uv tool run ruff check onevizion/ tests/

  # Summary job that all checks must pass
  check:
    name: All Tests Passed
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-latest

    steps:
      - name: Check test matrix status
        if: needs.test.result != 'success'
        run: exit 1

      - name: Check lint status
        if: needs.lint.result != 'success'
        run: exit 1

      - name: All checks passed
        run: echo "✅ All tests and lint checks passed!"
