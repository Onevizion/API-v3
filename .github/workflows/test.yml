name: Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 2.7 (requires ubuntu-20.04, last version with py27)
          - python-version: "2.7"
            os: ubuntu-20.04
            toxenv: py27

          # Python 3.x on latest Ubuntu
          - python-version: "3.5"
            os: ubuntu-20.04
            toxenv: py35

          - python-version: "3.6"
            os: ubuntu-20.04
            toxenv: py36

          - python-version: "3.7"
            os: ubuntu-latest
            toxenv: py37

          - python-version: "3.8"
            os: ubuntu-latest
            toxenv: py38

          - python-version: "3.9"
            os: ubuntu-latest
            toxenv: py39

          - python-version: "3.10"
            os: ubuntu-latest
            toxenv: py310

          - python-version: "3.11"
            os: ubuntu-latest
            toxenv: py311

          - python-version: "3.12"
            os: ubuntu-latest
            toxenv: py312

          - python-version: "3.13"
            os: ubuntu-latest
            toxenv: py313

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox tox-gh-actions

      - name: Run tests with tox
        run: tox -e ${{ matrix.toxenv }}

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Archive coverage HTML report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v3
        with:
          name: coverage-html
          path: htmlcov/

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run flake8
        run: flake8 onevizion/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check code formatting with black
        run: black --check onevizion/
