[tox]
# Test against Python 2.7 through 3.13
# Python 2.7 is the minimum testable version (2.6 lacks modern tooling support)
envlist = py27,py35,py36,py37,py38,py39,py310,py311,py312,py313
skip_missing_interpreters = True

[testenv]
deps =
    -rrequirements-dev.txt
    requests

commands =
    pytest tests/ -v --cov=onevizion --cov-report=term-missing --cov-report=html --cov-report=xml

[testenv:py27]
# Python 2.7 specific configuration
deps =
    pytest<5.0
    pytest-cov<2.6
    vcrpy<2.0
    mock
    requests

[testenv:py35]
# Python 3.5 specific (EOL but may still be in use)
deps =
    pytest<6.2
    pytest-cov<3.0
    vcrpy>=2.0,<4.0
    requests

[testenv:lint]
basepython = python3
deps =
    flake8>=3.8
    black>=22.0
commands =
    flake8 onevizion/ tests/
    black --check onevizion/ tests/

[testenv:type]
basepython = python3
deps =
    mypy>=0.900
    types-requests
commands =
    mypy onevizion/

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short

[coverage:run]
source = onevizion
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .tox,
    .venv,
    venv
ignore = E203,W503
